# Data Refresh — the pipeline's heartbeat, off the Mac.
# ======================================================
# Ports the launchd agents to GitHub Actions. Each cron slot maps to one
# scheduled_refresh.py schedule (the script commits data/+outputs/ and
# pushes itself via deploy_site(), which redeploys Render + Vercel).
# Times are UTC mirrors of the Central-time launchd slots — they drift
# an hour when DST flips, which every job here tolerates.
#
# Euro (DPWT) ops aren't in scheduled_refresh, so they're steps here:
# Monday settles last week's euro event + fetches the new field; the
# evening slots snapshot euro rounds during euro events.
#
# Live-tab data needs no job at all: Render self-freshens (CLOUD_FETCH).

name: Data Refresh
run-name: >-
  Data Refresh | ${{ github.event_name == 'schedule' && github.event.schedule || inputs.schedule }}
on:
  schedule:
    - cron: '0 11 * * 1'      # Mon 06:00 CT — monday refresh (+ euro settle/field)
    - cron: '0 13 * * 1'      # Mon 08:00 CT — post-tournament re-settle
    - cron: '0 2 * * 1'       # Sun 21:00 CT — post-tournament settle
    - cron: '0 4 * * 1'       # Sun 23:00 CT — record results
    - cron: '0 11 * * 2'      # Tue 06:00 CT — tuesday-morning
    - cron: '0 23 * * 2'      # Tue 18:00 CT — tuesday-evening
    - cron: '0 11 * * 3'      # Wed 06:00 CT — wednesday-morning
    - cron: '0 23 * * 3'      # Wed 18:00 CT — wednesday-evening
    - cron: '0 1 * * 5,6,0,1' # Thu–Sun 20:00 CT — euro rounds snapshot
    - cron: '0 17 * * 4,5,6,0' # Thu–Sun 12:00 CT — midday euro rounds (chat leaderboard freshness)
  workflow_dispatch:
    inputs:
      schedule:
        description: Which schedule to run
        type: choice
        default: auto
        options: [auto, monday, tuesday-morning, tuesday-evening, wednesday-morning, wednesday-evening, record, post-tournament, euro-rounds]
      dry_run:
        description: Dry run (log what would happen, change nothing)
        type: boolean
        default: false

permissions:
  contents: write

env:
  TZ: America/Chicago
  DG_API_KEY: ${{ secrets.DG_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One publisher at a time across BOTH publishing workflows (data-refresh and
    # tuesday-predictions push data/ + outputs/ to main; audit finding 15). A
    # queued run waits for the running one, then checks out main (ref: main
    # below), so it computes from what was just published, not from its
    # trigger-time commit. GitHub keeps ONE pending run per group: a third
    # arrival cancels the pending one. That takes a cron slot, a watchdog
    # dispatch and a running job inside a few minutes; the watchdog checks
    # outcomes (predictions present, event settled), so it re-dispatches a
    # cancelled run.
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: pip install -r requirements-api.txt

      - name: Git identity (deploy_site commits as the Actions bot)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pick schedule for this trigger
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 13 * * 1"|"0 2 * * 1")  S=post-tournament ;;
            "0 4 * * 1")               S=record ;;
            "0 1 * * 5,6,0,1")         S=euro-rounds ;;
            "0 17 * * 4,5,6,0")        S=euro-rounds ;;
            "")                        S="${{ inputs.schedule }}" ;;  # manual dispatch
            *)                         S=auto ;;                      # mon/tue/wed slots
          esac
          echo "schedule=$S" >> "$GITHUB_OUTPUT"
          echo "Running schedule: $S"

      - name: Run scheduled refresh
        id: refresh
        # Exits 1 when a critical task (Predictions) fails: it publishes
        # nothing from outputs/ and the run goes red, so the watchdog
        # re-dispatches the slot (audit finding 4).
        if: steps.pick.outputs.schedule != 'euro-rounds'
        run: |
          python3 scripts/scheduled_refresh.py \
            --schedule "${{ steps.pick.outputs.schedule }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Euro settle + new field + OUR model predictions (Mondays)
        if: "!cancelled() && (github.event.schedule == '0 11 * * 1' || inputs.schedule == 'monday') && inputs.dry_run != true"
        run: |
          # DG assigns euro event ids only ~2 weeks ahead (later ones are
          # "TBD" and skipped) — refetch weekly or the DPWT falls off the
          # calendar once the known window runs out.
          python3 scripts/scrapers/fetch_dg_event_list.py           || true  # event dates for date-ordered features
          python3 scripts/scrapers/fetch_euro_events.py --schedule || true
          python3 scripts/scrapers/fetch_euro_events.py --results  || true
          python3 scripts/scrapers/fetch_euro_events.py --field    || true
          python3 scripts/scrapers/fetch_euro_events.py --preds    || true
          python3 scripts/scrapers/fetch_euro_events.py --teetimes || true
          python3 scripts/predictions/predict_euro.py              || true

      - name: Euro field + OUR model predictions (Tue/Wed — after DG rolls over)
        # Monday's step often runs while DG still serves LAST week's euro
        # event, so the new field never arrived (Dunhill Links, 9/30, had
        # no field or predictions the day before it started). The Tue/Wed
        # slots catch the rollover; every fetch is event-name guarded and
        # idempotent, so a repeat is a no-op.
        # Scheduled Tue/Wed slots, or a manual/watchdog dispatch of those slots
        # (GitHub's scheduler drops runs; /api/watchdog re-dispatches them).
        if: "!cancelled() && (contains(fromJSON('[\"0 11 * * 2\",\"0 23 * * 2\",\"0 11 * * 3\",\"0 23 * * 3\"]'), github.event.schedule) || contains(fromJSON('[\"tuesday-morning\",\"tuesday-evening\",\"wednesday-morning\",\"wednesday-evening\"]'), inputs.schedule)) && inputs.dry_run != true"
        run: |
          # Schedule first: DG may assign this week's event id after
          # Monday's refresh, and a field written under a provisional id
          # (E2026T...) would be orphaned when the real one arrives.
          python3 scripts/scrapers/fetch_euro_events.py --schedule || true
          python3 scripts/scrapers/fetch_euro_events.py --field    || true
          python3 scripts/scrapers/fetch_euro_events.py --teetimes || true
          python3 scripts/scrapers/fetch_euro_events.py --preds    || true
          python3 scripts/predictions/predict_euro.py              || true

      - name: Euro rounds snapshot + refreshed predictions (tournament evenings)
        if: "!cancelled() && steps.pick.outputs.schedule == 'euro-rounds' && inputs.dry_run != true"
        run: |
          python3 scripts/scrapers/fetch_euro_events.py --rounds   || true
          python3 scripts/scrapers/fetch_euro_events.py --preds    || true
          python3 scripts/scrapers/fetch_euro_events.py --teetimes || true
          python3 scripts/predictions/predict_euro.py              || true

      - name: Commit euro output; push anything stranded
        if: "!cancelled() && inputs.dry_run != true"
        # Also rescues a commit deploy_site made but failed to push (race
        # with another push): the rebase+push below is a no-op when in sync.
        run: |
          # If the PGA refresh failed, its prediction outputs were rejected:
          # put them back to main before staging, even if the script crashed
          # before restoring them itself. (CI checkout: safe to clean.)
          if [ "${{ steps.refresh.outcome }}" = "failure" ]; then
            git checkout HEAD -- outputs data/prediction_tracking
            git clean -fdq -- outputs data/prediction_tracking
            echo "::warning::PGA refresh failed: committing euro output and inputs only."
          fi
          git add data/ outputs/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-deploy: ${{ steps.pick.outputs.schedule }} (Actions)"
          fi
          # --autostash: the refresh writes tracked files under logs/ we
          # don't commit; rebase refuses unstaged changes without it.
          git pull --rebase --autostash origin main
          git push origin main
