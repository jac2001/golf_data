# Tuesday Predictions — the full weekly pipeline, off the Mac.
# =============================================================
# Runs after the tuesday-morning data refresh: fetches the field, runs
# the model, saves the per-event archive (--save-tracking), commits the
# outputs, then nudges model-sync so the model takes its picks the same
# morning (the daily noon-UTC cron fires BEFORE these predictions exist,
# so without the nudge the model would lag a day).
#
# The pipeline's sanity checks can fail on missing odds files (DK often
# posts late, or blocks datacenter IPs) — that must not discard fresh
# predictions. So: run tolerantly, then gate the commit on one question
# only — did latest_predictions.csv actually regenerate?

name: Tuesday Predictions

on:
  schedule:
    - cron: '30 12 * * 2'   # Tue 07:30 CT (after the 06:00 CT refresh)
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: America/Chicago
  DG_API_KEY: ${{ secrets.DG_API_KEY }}
  # golf-pipeline workspace key — powers the intel fetch; the step
  # skips gracefully when the secret is unset or out of credits.
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  # Shared with Vercel's env: authenticates the post-pipeline model-sync call.
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  PYTHONUNBUFFERED: "1"

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Shared with data-refresh.yml: one publisher at a time (see the note there).
    concurrency:
      group: publish-main
      cancel-in-progress: false
    outputs:
      pga_week: ${{ steps.week.outputs.pga_week }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Is there a PGA TOUR event this week?
        # Off weeks (e.g. Oct 15-18, 2026) have no event to predict:
        # run_pipeline falls back to the NEXT event, whose field DataGolf
        # doesn't publish until its own week, so the field guard refuses
        # and the run went red with a failure email for a non-problem.
        # The watchdog re-dispatches inside 3 days of a start, so nothing
        # real is lost by skipping here.
        id: week
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, datetime, sys
          sys.path.insert(0, "scripts")
          from config import schedule_csv   # the active season (season_resolver), not a hardcoded year
          today = datetime.date.today()
          rows = csv.DictReader(open(schedule_csv()))
          soon = [r for r in rows
                  if 0 <= (datetime.date.fromisoformat(r["start_date"]) - today).days <= 6]
          print(f"pga_week={'true' if soon else 'false'}")
          print(f"tid={soon[0]['tournament_id'].strip().upper() if soon else ''}")
          PY
          if grep -q "pga_week=false" "$GITHUB_OUTPUT"; then
            echo "::notice::No PGA TOUR event starts in the next 6 days (off week) — skipping the weekly pipeline."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: pip install -r requirements-api.txt shap

      - name: Integrity gate tests (a weakened gate must not ship)
        run: |
          python3 scripts/validation/test_prediction_integrity.py
          python3 scripts/validation/test_euro_integrity.py
          python3 scripts/features/test_euro_features.py
          python3 scripts/scrapers/test_euro_schedule.py
          python3 scripts/scrapers/test_euro_purses.py
          python3 scripts/validation/test_model_manifest.py
          python3 scripts/scrapers/test_event_guard.py
          python3 scripts/scrapers/test_event_names.py
          python3 scripts/scrapers/test_dg_historical.py
          python3 scripts/test_season_resolver.py
          python3 scripts/features/test_event_dates.py
          python3 scripts/features/test_golfer_form.py

      - name: Run weekly pipeline
        if: steps.week.outputs.pga_week == 'true'
        run: |
          # Fresh event dates first: features order each player's history by date,
          # and an event missing from this list would be dropped from his form.
          python3 scripts/scrapers/fetch_dg_event_list.py || true
          # DataGolf's pre-tournament predictions + decompositions for THIS
          # week's event, fetched here instead of trusting the 06:00 CT
          # refresh to have run: GitHub dropped that slot on Oct 20 and the
          # pipeline found last week's file (the guard + integrity gate caught
          # it). Each fetcher checks DataGolf's event name and refuses a
          # mismatch, so a feed still on another event can't be merged.
          if [ -n "${{ steps.week.outputs.tid }}" ]; then
            python3 scripts/scrapers/fetch_dg_pre_tournament.py --tournament-id "${{ steps.week.outputs.tid }}" || echo "::warning::DG pre-tournament fetch refused or failed"
            python3 scripts/scrapers/fetch_dg_decompositions.py --tournament-id "${{ steps.week.outputs.tid }}" || echo "::warning::DG decompositions fetch refused or failed"
          fi
          # The pipeline's own exit status is the verdict (it exits 1 when the
          # integrity/freshness gates refuse). PIPESTATUS, because a plain
          # pipe reports tee's status. On failure, put the prediction files
          # back to main so nothing later can commit them (audit finding 16).
          set +e
          python3 scripts/run_pipeline.py \
            --auto-weekly --lineup --calibrate --save-tracking \
            2>&1 | tee pipeline.log
          status=${PIPESTATUS[0]}
          set -e
          tail -30 pipeline.log >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            git checkout HEAD -- outputs data/prediction_tracking
            git clean -fdq -- outputs data/prediction_tracking
            echo "::error::run_pipeline exited $status: predictions rejected, nothing published. See the log tail in the step summary."
            exit 1
          fi

      - name: Verify the predictions are for this week's event
        if: steps.week.outputs.pga_week == 'true'
        # A success artifact, not the absence of an error phrase: the file the
        # site serves must exist, hold rows, and be labeled with THIS week's
        # tournament (an early return or a stale file fails here).
        run: |
          python3 - <<'PY'
          import csv, sys
          want = "${{ steps.week.outputs.tid }}"
          try:
              rows = list(csv.DictReader(open("outputs/latest_predictions.csv")))
          except FileNotFoundError:
              sys.exit("::error::outputs/latest_predictions.csv is missing")
          got = {r.get("tournament_id", "").strip().upper() for r in rows}
          if not rows or got != {want}:
              sys.exit(f"::error::latest_predictions.csv is for {sorted(got) or 'nothing'}, expected {want}")
          print(f"latest_predictions.csv: {len(rows)} players for {want}")
          PY

      - name: Commit and push outputs
        if: steps.week.outputs.pga_week == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ outputs/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-deploy: tuesday predictions (Actions)"
          fi
          git pull --rebase --autostash origin main
          git push origin main

  # Outside the publish lock: waiting on Render publishes nothing, and
  # holding the lock for 20 minutes would queue (and risk dropping) refreshes.
  model-sync:
    needs: predict
    if: needs.predict.outputs.pga_week == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for Render, then let the model take its turn
        run: |
          for i in $(seq 1 20); do
            sleep 60
            fresh=$(curl -s "https://golf-app-a3yw.onrender.com/api/predictions?limit=1" \
              | python3 -c "import sys,json,datetime; d=json.load(sys.stdin); print(d.get('tournament_id',''))" 2>/dev/null || true)
            open_tid=$(curl -s "https://golf-app-a3yw.onrender.com/api/events/open" \
              | python3 -c "
          import sys,json
          evs=[e for e in json.load(sys.stdin).get('events',[]) if e.get('has_model') and not e.get('locked')]
          print(evs[0]['tournament_id'] if evs else '')" 2>/dev/null || true)
            echo "render serves: $fresh · open PGA event: $open_tid"
            if [ -n "$fresh" ] && [ "$fresh" = "$open_tid" ]; then
              echo "Render is serving this week's predictions — running model-sync."
              # Same secret Vercel Cron presents — model-sync refuses callers without it.
              curl -s -H "Authorization: Bearer $CRON_SECRET" "https://playgolfedge.com/api/model-sync" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "Render never caught up within 20 min — the daily noon cron will cover tomorrow." | tee -a "$GITHUB_STEP_SUMMARY"

# schedule re-registration nudge: 2026-09-22
