name: Tuesday Morning Pipeline

# Runs Tuesday at 12:00 UTC (8am EDT) — fetches field, odds, DG data
# Does NOT run full predictions (that needs human judgment on the field)
# but does sync schedule + any updated DG data to Supabase
on:
  schedule:
    - cron: '0 12 * * 2'  # Tuesday 12:00 UTC
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: pip install -r requirements-api.txt

      - name: Sync schedule to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 -c "
          from scripts.database.supabase_sync import sync_tournaments
          n = sync_tournaments()
          print(f'Synced {n} tournaments to Supabase')
          "

      - name: Fetch DG pre-tournament data
        env:
          DG_API_KEY: ${{ secrets.DG_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/scheduled_refresh.py --schedule tuesday-morning
