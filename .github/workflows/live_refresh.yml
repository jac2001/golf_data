name: Live Tournament Refresh

# Runs hourly Thu-Sun 11am-11pm UTC (7am-7pm EDT)
# Fetches live leaderboard, DG stats, odds, bets → syncs to Supabase
on:
  schedule:
    - cron: '0 11-23 * * 0,4,5,6'
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: pip install -r requirements-api.txt

      - name: Run live refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DG_API_KEY: ${{ secrets.DG_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/scheduled_refresh.py --schedule live
